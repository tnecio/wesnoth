# test_combat.cfg — Minimal deterministic scenario for wesnothlite integration tests.
#
# Layout (wl-cli hex coordinates):
#   (2,1) = Side 1 leader (Horseman) on keep hex — used for recruit tests
#   (3,1) = Castle hex adjacent to keep — recruit target
#   (2,2) = Castle hex adjacent to keep — recruit target
#   (5,4) = Side 1 Spearman — used for move and attack tests
#   (6,4) = Side 2 Goblin Spearman (leader) — attack target
#
# (5,4) and (6,4) are adjacent (verified by hex adjacency formula).

[scenario]
    id=basic_scenario
    name="[Test] Basic Scenario"
    map_file=campaigns/BasicCampaign/maps/basic_scenario.map
    turns=-1
    next_scenario=null

    {DEFAULT_SCHEDULE}

    # ── Side 1: Human player ───────────────────────────────────────────────

    [side]
        side=1
        controller=human
        gold=200
        team_name=good
        user_team_name="Test Player"
        recruit=Spearman,Bowman

        type=Horseman
        id=wl_test_leader
        name="Test Leader"
        canrecruit=yes
        x=2
        y=1

        [unit]
            type=Spearman
            id=wl_test_fighter
            name="Test Fighter"
            x=5
            y=4
        [/unit]
    [/side]

    # ── Side 2: AI enemy ───────────────────────────────────────────────────

    [side]
        side=2
        controller=ai
        gold=0
        team_name=evil
        user_team_name="Test Enemy"

        type=Goblin Spearman
        id=wl_test_enemy
        name="Test Enemy"
        canrecruit=yes
        x=6
        y=4
    [/side]

    # ── Victory / defeat conditions ────────────────────────────────────────

    [objectives]
        [objective]
            description="Defeat the enemy leader"
            condition=win
        [/objective]
        [objective]
            description="Death of Test Leader"
            condition=lose
        [/objective]
    [/objectives]

[/scenario]
