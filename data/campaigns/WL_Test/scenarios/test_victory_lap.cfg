# test_victory_lap.cfg — Second scenario in the WL_Test campaign.
#
# Used to test campaign progression (continuing to a second scenario after
# winning the first). The player starts with a single unit and no enemies,
# so ending the turn immediately triggers victory.

[scenario]
    id=test_victory_lap
    name="[Test] Victory Lap"
    map_file=campaigns/WL_Test/maps/test_victory_lap.map
    turns=-1
    next_scenario=null

    {DEFAULT_SCHEDULE}

    # ── Side 1: Human player ───────────────────────────────────────────────

    [side]
        side=1
        controller=human
        gold=100
        team_name=good
        user_team_name="Test Player"
        recruit=Spearman

        type=Horseman
        id=wl_test_leader_s2
        name="Test Leader"
        canrecruit=yes
        x=3
        y=2
    [/side]

    # ── Victory condition: survive (no enemies) ────────────────────────────

    [objectives]
        [objective]
            description="End your turn to complete the campaign"
            condition=win
        [/objective]
        [objective]
            description="Death of Test Leader"
            condition=lose
        [/objective]
    [/objectives]

    # ── Auto-win on turn start (no enemies present) ────────────────────────

    [event]
        name=turn 1
        [endlevel]
            result=victory
            bonus=no
            carryover_percentage=0
            linger_mode=no
        [/endlevel]
    [/event]

[/scenario]
